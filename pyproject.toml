[project]
name = "neurosupply"
version = "0.1.0"
description = "Autonomous Inventory Management System for Bo"
authors = [
    {name = "NeuroSupply Team", email = "dev@neurosupply.internal"},
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.0.0",
    "aiogram>=3.13.0",
    "openpyxl>=3.1.0",
    "pandas>=2.2.0",
    "redis>=5.0.0",
    "taskiq>=0.11.0",
    "taskiq-redis>=0.5.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "alembic>=1.13.0",
    "tenacity>=8.2.0",
    "gspread>=6.0.0",
    "google-auth>=2.0.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "apscheduler>=3.10.0",
]
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "mypy>=1.11.0"
]

[tool.isort]
profile = "black"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
