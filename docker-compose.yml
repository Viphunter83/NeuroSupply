services:
  db:
    image: postgres:16-alpine
    container_name: neurosupply_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-neurosupply}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: neurosupply_redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  app:
    build: .
    container_name: neurosupply_api
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis
    environment:
      - PG_DSN=postgresql+asyncpg://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-neurosupply}
      - PYTHONPATH=/app

  bot:
    build: .
    container_name: neurosupply_bot
    command: python src/bot/main.py
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis
      - app
    environment:
      - PG_DSN=postgresql+asyncpg://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-neurosupply}
      - PYTHONPATH=/app

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: neurosupply_frontend
    ports:
      - "8090:80"
    depends_on:
      - app

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: neurosupply_tunnel
    restart: always
    command: tunnel --protocol http2 --url http://frontend:80
    depends_on:
      - frontend
      - app

volumes:
  postgres_data:
  redis_data:
