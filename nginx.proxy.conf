events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;

        # Web Dashboard (Next.js)
        location /dashboard {
            proxy_pass http://dashboard:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Next.js internal assets
        location /_next {
            proxy_pass http://dashboard:3000;
            proxy_set_header Host $host;
        }

        # Public assets for Next.js
        location /manifest.json { proxy_pass http://dashboard:3000; }
        location /icon-512x512.png { proxy_pass http://dashboard:3000; }

        # Legacy Vue App (Mini App)
        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # API requests direct to Backend
        location /api/ {
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
